packages:
  - "apps/*"
  # Expo app: installed with npm inside apps/mobile (npx expo install), not by pnpm
  - "!apps/mobile"
  - "packages/*"
allowBuilds:
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
  unrs-resolver: true
