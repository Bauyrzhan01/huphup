<meta name="description" content="{{ page_desc }}" />
<meta property="og:type" content="{{ og_type|default('website') }}" />
<meta property="og:site_name" content="HupHup" />
<meta property="og:title" content="{{ page_title }}" />
<meta property="og:description" content="{{ page_desc }}" />
<meta property="og:locale" content="{{ lang }}_{{ 'KZ' if lang == 'kk' else lang|upper }}" />
<meta property="og:url" content="{{ request.url_root.rstrip('/') }}{{ request.path }}" />
<meta property="og:image" content="{{ url_for('static', filename='img/huphup-logo.png', _external=True) }}" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="{{ page_title }}" />
<meta name="twitter:description" content="{{ page_desc }}" />
<link rel="icon" href="{{ url_for('static', filename='img/huphup-logo.png') }}" />
<link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}" />
